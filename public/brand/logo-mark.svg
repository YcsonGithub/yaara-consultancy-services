<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yaara Consultancy Services">
  <title>Yaara Consultancy Services</title>
  <!--
    Flat monogram, tuned to stay legible down to 16px.
    Geometry mirrors the brand lockup: two-tone open ring, navy "Y",
    two ascending gold bars, gold growth arrow.
  -->
  <!-- Two-tone open ring: navy sweeps left-over-top, gold the remainder. -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#0E2A47" stroke-width="4.5"
          stroke-dasharray="81.7 163.4" stroke-linecap="round" transform="rotate(90 32 32)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#B8873B" stroke-width="4.5"
          stroke-dasharray="81.7 163.4" stroke-linecap="round" transform="rotate(0 32 32)"/>

  <!-- "Y" monogram: two raised arms meeting a trunk. -->
  <path d="M32 50V30" fill="none" stroke="#0E2A47" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M32 31.5 22 21.5M32 31.5 42 21.5" fill="none" stroke="#0E2A47" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Two ascending bars, tucked inside the ring. -->
  <rect x="35" y="34" width="5" height="10" rx="2.5" fill="#B8873B"/>
  <rect x="42" y="27" width="5" height="17" rx="2.5" fill="#B8873B"/>

  <!-- Growth arrow, breaking the ring at the top right. -->
  <path d="M38 20l6.5-6.5L51 20M44.5 13.5V24" fill="none" stroke="#B8873B"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>