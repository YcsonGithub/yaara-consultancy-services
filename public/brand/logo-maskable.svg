<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yaara Consultancy Services">
  <title>Yaara Consultancy Services</title>
  <!--
    Maskable variant: full-bleed navy plate so Android's circular/squircle
    mask crops land on colour, never on transparency. The monogram is
    inverted to paper so it stays legible against the navy fill.
  -->
  <rect width="64" height="64" fill="#0E2A47"/>
  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#FAF7F1" stroke-width="4.5"
            stroke-dasharray="81.7 163.4" stroke-linecap="round" transform="rotate(90 32 32)"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#D4A855" stroke-width="4.5"
            stroke-dasharray="81.7 163.4" stroke-linecap="round" transform="rotate(0 32 32)"/>

    <path d="M32 50V30" fill="none" stroke="#FAF7F1" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M32 31.5 22 21.5M32 31.5 42 21.5" fill="none" stroke="#FAF7F1" stroke-width="5.5" stroke-linecap="round"/>

    <rect x="35" y="34" width="5" height="10" rx="2.5" fill="#D4A855"/>
    <rect x="42" y="27" width="5" height="17" rx="2.5" fill="#D4A855"/>

    <path d="M38 20l6.5-6.5L51 20M44.5 13.5V24" fill="none" stroke="#D4A855"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>