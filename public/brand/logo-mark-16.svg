<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yaara Consultancy Services">
  <title>Yaara Consultancy Services</title>
  <!--
    16px variant. At that size the arrow head collides with the ring and
    turns to mud, so the mark is reduced to the two strongest shapes —
    the two-tone ring and the "Y" — with heavier strokes to hold up.
    Used only for the 16×16 .ico entry; 32px and up use logo-mark.svg.
  -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#0E2A47" stroke-width="7"
          stroke-dasharray="85 85" stroke-linecap="round" transform="rotate(-45 32 32)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#B8873B" stroke-width="7"
          stroke-dasharray="85 85" stroke-linecap="round" transform="rotate(45 32 32)"/>

  <path d="M32 52V33" fill="none" stroke="#0E2A47" stroke-width="8" stroke-linecap="round"/>
  <path d="M32 34 20 22M32 34 44 22" fill="none" stroke="#0E2A47" stroke-width="8" stroke-linecap="round"/>
</svg>